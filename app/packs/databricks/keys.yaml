# Structure layer for the Databricks pack. Driver-owned: content writers read this file
# and never edit it. Ask for a key change in the hand-back instead.
# Topic ids and decision keys match the Fabric pack; option values are platform-specific.
pack: databricks
topics:
  # ---- Part 1. Architecture ----
  - number: 1
    id: medallion_layers
    decision_key: medallion.layers
    cluster: architecture
    status: core
    weight: deep
    mode: decide
    renderer: cards
    decision_type: single
    required: true
    recommendation: [bronze_silver_gold]
    canvas_element: layers
    options:
      - { value: raw_serving, canvas_effect: { type: layer_boxes, layers: [raw, serving] } }
      - { value: bronze_silver_gold, canvas_effect: { type: layer_boxes, layers: [bronze, silver, gold] } }
      - { value: bronze_silver_gold_mart, canvas_effect: { type: layer_boxes, layers: [bronze, silver, gold, mart] } }
    modifiers:
      - { id: landing_volume, decision_key: medallion.landing, on_value: landing_volume, off_value: none, canvas_effect: { type: landing_zone, on: true } }

  - number: 2
    id: isolation_strategy
    decision_key: platform.isolation
    cluster: architecture
    status: core
    weight: deep
    mode: decide
    renderer: cards
    decision_type: single
    required: true
    recommendation: [catalog_per_domain_env]
    canvas_element: containers
    options:
      - { value: catalog_per_domain_env, canvas_effect: { type: container_grouping, pattern: per_domain } }
      - { value: catalog_per_env, canvas_effect: { type: container_grouping, pattern: single } }
      - { value: catalog_per_layer_env, canvas_effect: { type: container_grouping, pattern: per_layer } }
    modifiers:
      - { id: workspace_binding, decision_key: platform.workspace_binding, on_value: bound, off_value: open }

  - number: 3
    id: platform_centralization
    decision_key: platform.centralization
    cluster: architecture
    status: core
    weight: deep
    mode: decide
    renderer: cards
    decision_type: single
    required: false
    recommendation: [backbone_domain_catalogs]
    value_fields:
      - { id: platform_owner, type: text, required: false }
    options:
      - { value: backbone_domain_catalogs }
      - { value: fully_centralized }
      - { value: federated_sharing }

  - number: 4
    id: ingestion
    decision_key: integration.mechanisms
    cluster: architecture
    status: core
    weight: deep
    mode: decide
    renderer: source_mapper
    decision_type: multi
    required: true
    recommendation: []
    canvas_element: sources
    options:
      - { value: lakeflow_connect }
      - { value: auto_loader }
      - { value: lakehouse_federation }
      - { value: delta_sharing_inbound }
      - { value: custom_jobs }
      - { value: structured_streaming }
      - { value: partner_etl }

  - number: 5
    id: storage_engine
    decision_key: storage.engine
    cluster: architecture
    status: core
    weight: deep
    mode: decide
    renderer: cards
    decision_type: single
    required: true
    recommendation: [managed_tables]
    canvas_element: layers
    options:
      - { value: managed_tables, canvas_effect: { type: layer_engines, default: managed } }
      - { value: external_tables, canvas_effect: { type: layer_engines, default: external } }
      - { value: mixed, canvas_effect: { type: layer_engines, default: managed, first: external } }

  - number: 6
    id: transform_tool
    decision_key: platform.transform_tool
    cluster: architecture
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: multi
    required: false
    recommendation: []
    options:
      - { value: lakeflow_pipelines }
      - { value: spark_jobs }
      - { value: sql_materialized }
      - { value: dbt }

  - number: 7
    id: transform_location
    decision_key: platform.transform_location
    cluster: architecture
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: single
    required: false
    recommendation: []
    canvas_element: containers
    options:
      - { value: colocated, canvas_effect: { type: transform_band, on: false } }
      - { value: separate_engineering, canvas_effect: { type: transform_band, on: true } }

