      - { value: ado, canvas_effect: { type: footer_badge, label_id: git_ado } }
      - { value: gitlab, canvas_effect: { type: footer_badge, label_id: git_gitlab } }
      - { value: none }

  - number: 13
    id: cicd
    decision_key: ops.deployment
    cluster: platform_setup
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: multi
    required: false
    recommendation: [bundles_ci, terraform_infra]
    options:
      - value: bundles_ci
        requires:
          - { decision_key: ops.git_platform, not_in: [none], severity: block, reason_id: ci_needs_git }
      - { value: terraform_infra }
      - { value: bundles_manual }
      - { value: manual }

  - number: 14
    id: disaster_recovery
    decision_key: dr.posture
    cluster: platform_setup
    status: core
    weight: deep
    mode: decide
    renderer: cards
    decision_type: single
    required: false
    recommendation: []
    options:
      - { value: zone_redundancy }
      - value: managed_dr
        requires:
          - { decision_key: platform.region, in: [multi_region], severity: block, reason_id: needs_multi_region }
          - { decision_key: cap.strategy, any_of: [serverless_jobs, serverless_sql, serverless_notebooks], severity: block, reason_id: managed_dr_serverless }
      - value: diy_active_passive
        requires:
          - { decision_key: platform.region, in: [multi_region], severity: warn, reason_id: secondary_region }
      - value: active_active
        requires:
          - { decision_key: platform.region, in: [multi_region], severity: block, reason_id: needs_multi_region }

