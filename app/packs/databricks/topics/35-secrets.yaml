id: secrets
title: Secrets management
situation: >-
  Jobs and apps need credentials for outside systems: API keys, database passwords, tokens.
  They should not sit in notebooks or repositories. Databricks can hold them in secret scopes,
  read them from a cloud vault, or reach cloud services through Unity Catalog service
  credentials that avoid stored keys. The right mix depends on your cloud and on who must
  rotate and audit secrets.
intake:
  - Which cloud secret manager does your security team already operate and audit?
  - Which jobs and apps hold credentials today, and who rotates them?
  - Can the systems you connect to use cloud identity instead of a stored key?
recommendation_note: ''
adr_context: >-
  The secret stores listed in this record were chosen. Credentials never appear in code,
  notebooks or repository files. Access is limited to the jobs and groups that need it,
  rotation is owned by the team that owns the connection, and cloud identity is preferred
  over stored keys where the target supports it.
options:
  - value: secret_scopes_key_vault
    label: Azure Key Vault-backed secret scopes
    description: On Azure, a secret scope can be a read-only view of an Azure Key Vault, so the vault stays the source of truth.
    tradeoff: Secrets are managed in the vault your security team already runs, but the scope is read-only in Databricks.
    pros:
      - Rotation, access policy and audit stay in the vault
      - Secrets are written in one place only
      - Existing vault processes keep working
    cons:
      - Azure-specific, and the vault must use the access policy permission model, not Azure RBAC
      - Creating the scope needs rights on the vault
    adr_context: >-
      Secret scopes backed by Azure Key Vault were chosen. Secrets are created and rotated in
      the vault by the security team, and Databricks reads them through read-only scopes
      aligned to roles or applications.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://learn.microsoft.com/azure/databricks/security/secrets/
        title: Secret management on Azure Databricks
      - url: https://docs.databricks.com/aws/en/security/secrets/
        title: Secret management
  - value: secret_scopes_databricks
    label: Databricks-backed secret scopes
    description: Secrets are stored in a secret scope that Databricks manages. Access is granted on the scope.
    tradeoff: Works on every cloud with no outside vault, but secrets live in Databricks and are managed there.
    pros:
      - Same behaviour on Azure, AWS and Google Cloud
      - Secrets can be created through the CLI, API or SDK
      - Scopes can be aligned to roles or applications
    cons:
      - Workspace admins, secret creators and granted users can read values
      - Scopes are workspace-level and are not governed by Unity Catalog privileges
    adr_context: >-
      Databricks-backed secret scopes were chosen. One scope exists per application or role,
      access is granted to the owning group, and the owning team rotates each secret on a
      schedule.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://docs.databricks.com/aws/en/security/secrets/
        title: Secret management
  - value: uc_service_credentials
    label: Unity Catalog service credentials and secrets
    description: Service credentials give access to cloud services through a cloud identity, and Unity Catalog secrets store other values under catalog privileges.
    tradeoff: Governed like data and avoids stored keys for cloud services, but not every target is supported.
    pros:
      - Access to a service credential goes to users, groups or service principals, not to a cluster
      - Unity Catalog secrets use the same grants, inheritance and audit as other objects
      - Metastore-wide, so one definition serves every attached workspace
    cons:
      - External secrets backed by a cloud secret manager are in Beta
      - Teams must learn a second secrets model next to secret scopes
    adr_context: >-
      Unity Catalog service credentials were chosen for access to cloud services, and Unity
      Catalog secrets for other credentials. Access is granted to groups through Unity
      Catalog privileges and is audited with other data access.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://docs.databricks.com/aws/en/connect/unity-catalog/cloud-services/service-credentials
        title: Create service credentials
      - url: https://docs.databricks.com/aws/en/security/secrets/unity-catalog-secrets
        title: Secrets in Unity Catalog
      - url: https://docs.databricks.com/aws/en/security/secrets/external-secrets
        title: External secrets in Unity Catalog
