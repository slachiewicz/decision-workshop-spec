id: disaster_recovery
title: Disaster recovery
situation: >-
  Databricks keeps the control plane running through the loss of one availability zone in a
  region, but it does not protect against the loss of a whole region. Cross-region recovery
  needs a second workspace and metastore and a way to copy data and assets. Databricks now
  recommends managed disaster recovery where it is available, and keeps the manual approaches
  for cases it does not cover.
intake:
  - What recovery time and data-loss limit (RTO and RPO) does the business accept after a regional outage?
  - Which workloads must run in the second region, and which can wait until the primary returns?
  - Do you hold the plan (Enterprise on AWS, Premium on Azure) and Mission Critical support that managed disaster recovery requires?
  - Does your chosen region have a supported pair for managed disaster recovery?
recommendation_note: ''
adr_context: >-
  The disaster recovery posture was chosen against the recovery time and data-loss limits the
  business accepted. Zone redundancy covers the loss of a zone. Cross-region options were
  selected only where those limits require them, and the failover process is tested on a
  schedule.
options:
  - value: zone_redundancy
    label: Zone redundancy only
    description: Rely on multi-zone resilience inside one region. There is no second region.
    tradeoff: Lowest cost and effort, but a regional outage takes the platform down until the region returns.
    pros:
      - No second workspace, metastore or replication to run
      - The control plane recovers from a zone failure in about 15 minutes with no data loss
      - Serverless compute fails over between zones automatically
    cons:
      - No protection from a whole-region outage
      - Compute-plane resilience is yours to set up, for example zone-redundant storage and subnets across zones
      - Only one zone can be down at a time, and the region must have several zones
    adr_context: >-
      Zone redundancy only was chosen. The platform stays inside one region and relies on
      multi-zone resilience, with zone-redundant storage for workspace data. A regional outage is
      accepted as a risk, with recovery when the region returns.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://learn.microsoft.com/azure/reliability/reliability-databricks
        title: Reliability in Azure Databricks
      - url: https://docs.databricks.com/aws/en/admin/disaster-recovery
        title: Disaster recovery
  - value: managed_dr
    label: Managed disaster recovery
    description: Databricks replicates metadata, managed table data and workspace assets to a secondary region and runs failover.
    tradeoff: The least work for cross-region recovery, but it is gated and has strict prerequisites.
    pros:
      - Databricks runs the replication and failover, so you write no scripts
      - Optional stable URL keeps clients working after failover
      - Workspace asset IDs are preserved across regions
    cons:
      - Access is gated, so you must apply through your Databricks account team
      - Needs Enterprise (AWS) or Premium (Azure), Mission Critical, serverless, and a workspace and metastore per region. Not on GCP
      - Doesn't replicate pipelines, materialized views, streaming tables, managed volumes, secrets, models or published dashboards
      - External tables and external volumes replicate metadata only
      - On Azure only listed regions are supported, and some region pairs are not allowed
    adr_context: >-
      Managed disaster recovery was chosen. Databricks replicates Unity Catalog metadata, managed
      tables and workspace assets to a secondary region and runs failover. The prerequisites
      were confirmed: the required plan, Mission Critical, serverless compute, and a
      workspace and metastore in each region.
    maturity: gated
    as_of: '2026-10-18'
    sources:
      - url: https://docs.databricks.com/aws/en/admin/managed-disaster-recovery
        title: Managed disaster recovery
      - url: https://learn.microsoft.com/azure/databricks/admin/managed-disaster-recovery
        title: Managed disaster recovery
      - url: https://learn.microsoft.com/azure/databricks/resources/feature-region-support
        title: Features with limited regional availability
  - value: diy_active_passive
    label: DIY active-passive
    description: A passive deployment in a second region is kept in sync by your own code, infrastructure as code and Deep Clone.
    tradeoff: Works anywhere and gives fine control, but you build, test and maintain the replication.
    pros:
      - Covers resources managed disaster recovery does not replicate
      - Works across clouds and without the gated programme
      - Passive workspace can serve read-only queries
    cons:
      - You write and operate the sync, and keep identities, secrets and permissions aligned
      - Recovery time and data loss depend on how often you replicate
      - Needs regular failover tests
      - Deep clone isn't supported on tables with row filters, column masks or ABAC policies
    adr_context: >-
      A self-built active-passive setup was chosen. Infrastructure and code are deployed to both
      regions from Git, and managed table data is copied with Delta Deep Clone on a schedule
      matched to the recovery point objective. Failover is a documented, tested runbook.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://docs.databricks.com/aws/en/admin/disaster-recovery
        title: Disaster recovery
      - url: https://docs.databricks.com/aws/en/tables/operations/clone
        title: Clone a table on Databricks
      - url: https://docs.databricks.com/aws/en/data-governance/unity-catalog/filters-and-masks/
        title: Row filters and column masks
  - value: active_active
    label: Active-active
    description: Production jobs run in both regions at all times, and a job is done only when both runs succeed.
    tradeoff: Lowest recovery time and data loss, and the highest cost and complexity.
    pros:
      - Lowest RTO and RPO of the strategies
      - The second region runs the same processes in parallel, so it stays current
    cons:
      - Jobs run in both regions, which costs more than any other strategy
      - Production changes must go through CI/CD to both regions
      - Operations must check that each job succeeded in both regions
    adr_context: >-
      Active-active was chosen. All data processes run in both regions in parallel, production
      changes are deployed to both through CI/CD only, and jobs are marked complete when they
      succeed in both. The cost and complexity are accepted for the lowest recovery time.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://docs.databricks.com/aws/en/admin/disaster-recovery
        title: Disaster recovery
rule_reasons:
  needs_multi_region: Cross-region recovery needs a second region, so choose more than one region in the region decision.
  managed_dr_serverless: Managed disaster recovery needs serverless compute in both workspaces, so select at least one serverless option in the compute decision.
  secondary_region: A DIY active-passive setup needs a second region to fail over to, so choose more than one region in the region decision.
  dr_secured_tables: Managed DR can't replicate tables with row filters, column masks or ABAC policies; they fail to replicate and hold up the recovery point.
  dr_pipelines: Managed DR doesn't replicate Lakeflow pipelines, materialized views or streaming tables; they must be redeployed in the secondary region.
  dr_archival: Managed DR can't replicate tables with Delta archival support until archived files are restored and the property is unset.
  clone_secured_tables: Deep clone isn't supported on tables with row filters, column masks or ABAC policies, so those tables need another copy method.
