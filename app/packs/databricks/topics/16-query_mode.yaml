id: query_mode
title: Semantic layer and query mode
situation: >-
  Business metrics have to be defined somewhere. Unity Catalog metric views define measures
  and dimensions once, and Databricks dashboards, Genie and external BI tools such as Power BI
  and Tableau can all query them. A Power BI model can also import data from a SQL warehouse
  or query it live with DirectQuery. The right mix depends on where reports are built.
intake:
  - Where are reports built today, and where will they be built in a year?
  - Do the same metrics appear in more than one tool, with different numbers?
  - How fresh must report data be, and how large are the biggest models?
recommendation_note: The default follows the serving pattern. With external BI, import for speed and define shared metrics as metric views.
adr_context: >-
  Shared business metrics are defined as Unity Catalog metric views, so every tool that reads
  them gets the same numbers. Power BI models import from a SQL warehouse for speed, and
  switch to DirectQuery only where data must be current within minutes.
options:
  - value: metric_views
    label: Unity Catalog metric views
    description: Measures and dimensions defined once in Unity Catalog and queried from SQL, dashboards, Genie and BI tools.
    tradeoff: One definition of each metric everywhere, but the team must model metrics as code.
    pros:
      - Same numbers in Databricks dashboards, Genie and external BI
      - Governed and discoverable like any Unity Catalog object
      - Usable from Power BI, Tableau and Sigma
    cons:
      - Metric definitions become another artefact to review and deploy
      - Teams must agree on shared definitions before building reports
    adr_context: >-
      Unity Catalog metric views were chosen to define shared metrics once, so dashboards, Genie
      and external BI tools report the same numbers.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://docs.databricks.com/aws/en/uc-semantics/metric-views
        title: Unity Catalog metric views
  - value: import
    label: Power BI Import from a SQL warehouse
    description: Power BI loads a compressed copy from a SQL warehouse on a schedule and queries it in memory.
    tradeoff: Fastest report interactions, but data is only as fresh as the last refresh.
    pros:
      - Fast, predictable report performance
      - Full DAX and Power Query in the model
      - SQL warehouse load is limited to refresh windows
    cons:
      - Scheduled refreshes, and the model must fit in Power BI capacity memory
      - A second copy of the data lives in Power BI
    adr_context: >-
      Power BI Import was chosen for these models because report speed matters more than
      minute-level freshness, and scheduled refreshes from the SQL warehouse are acceptable.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://learn.microsoft.com/azure/databricks/partners/bi/power-bi/desktop
        title: Connect Power BI Desktop to Azure Databricks
      - url: https://learn.microsoft.com/power-bi/connect-data/service-dataset-modes-understand
        title: Semantic model modes in the Power BI service
  - value: directquery
    label: Power BI DirectQuery
    description: Every visual sends a query to a SQL warehouse. Power BI stores metadata only.
    tradeoff: Always current, but every click costs warehouse compute.
    pros:
      - Always shows current data, with no refresh
      - No model size limit
      - With single sign-on, queries run as the report viewer, so Unity Catalog permissions apply
    cons:
      - Slower visuals, and warehouse cost grows with report traffic
      - Limits on DAX and Power Query transformations
    adr_context: >-
      Power BI DirectQuery was chosen for these models because they must show data within
      minutes of it changing, and Unity Catalog permissions must apply per viewer.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://learn.microsoft.com/azure/databricks/partners/bi/power-bi/service
        title: Publish to the Power BI service from Azure Databricks
      - url: https://learn.microsoft.com/azure/databricks/compute/sql-warehouse/bi-workload-settings
        title: SQL warehouse settings for BI workloads
  - value: per_model
    label: Decide per model
    description: No platform default. Each model owner picks a mode and records why.
    tradeoff: Fits each model to its needs, but the platform team supports every mode.
    pros:
      - Each model gets the mode that suits its size and freshness needs
      - No forced migration of existing models
    cons:
      - Support, monitoring and warehouse sizing for every mode
      - Inconsistent behaviour across reports
    adr_context: >-
      No platform default was set. Each model owner chooses a query mode and records the reason
      in the model's documentation.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://learn.microsoft.com/power-bi/transform-model/desktop-storage-mode
        title: Table storage mode in Power BI semantic models
