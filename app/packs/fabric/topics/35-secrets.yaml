id: secrets
title: Secrets and credentials
situation: >-
  Pipelines, dataflows and shortcuts connect to sources with credentials. Fabric can store them in
  a connection, or point to a secret in Azure Key Vault. A Key Vault reference keeps the secret
  value out of Fabric and always reads the latest version, but it supports fewer connectors and has
  network limits.
intake:
  - Where do your source credentials live today, and who rotates them?
  - Is your Key Vault reachable from the public network, or only through a private endpoint?
  - Which connectors and authentication types do your sources need?
recommendation_note: ''
adr_context: >-
  The secret handling methods listed were chosen. Credentials for supported connectors are
  referenced from Azure Key Vault, and other connections store credentials in Fabric with a
  restricted user list. Each credential has a named owner who rotates it.
options:
  - value: stored_connections
    label: Stored connections
    description: Credentials are saved in Fabric connections and managed under Manage connections and gateways.
    tradeoff: Works for every connector with no Azure resource, but the secret value is held in Fabric.
    pros:
      - Works with every connector Fabric offers
      - No Azure Key Vault or extra access setup
      - The access list of a connection can be limited to named users
    cons:
      - The secret value is stored in Fabric, not in your vault
      - Rotation is done in each connection
      - The access list of each connection needs regular review
    adr_context: >-
      Credentials are stored in Fabric connections. Each connection has a restricted list of users,
      and the owner rotates the secret there. This was chosen because it works for all connectors
      and avoids a dependency on Key Vault.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://learn.microsoft.com/fabric/data-factory/secure-data-factory-in-microsoft-fabric
        title: Secure your Data Factory in Microsoft Fabric deployment
      - url: https://learn.microsoft.com/fabric/data-factory/azure-key-vault-reference-configure
        title: Configure Azure Key Vault references
  - value: key_vault_references
    label: Key Vault references
    description: Connections point to a secret in Azure Key Vault, which Fabric reads when it connects.
    tradeoff: Secret values stay in your vault and rotate there, but only listed connectors work.
    pros:
      - Fabric records only the vault address and secret name, not the value
      - Rotation happens in Key Vault, and Fabric always reads the latest version
      - Works for cloud and on-premises data gateway connections
    cons:
      - Only supported connectors and authentication types can use references
      - Virtual network data gateway connections are not supported
      - References cannot be created from the Get data pane, and lineage is not shown for them
    adr_context: >-
      Azure Key Vault references were chosen for connections to supported connectors. Secrets stay
      in the vault and rotate there, and Fabric reads the latest version at connection time. Sources
      that cannot use references fall back to stored connections.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://learn.microsoft.com/fabric/data-factory/azure-key-vault-reference-configure
        title: Configure Azure Key Vault references
