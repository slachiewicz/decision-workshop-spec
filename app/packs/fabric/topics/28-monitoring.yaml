id: monitoring
title: Monitoring and alerting
situation: >-
  Failed jobs and capacity throttling hurt users before anyone looks. The Monitor hub shows job
  runs, capacity and alerts in one place. Activator rules can email people or run a function on
  capacity and job events, and workspace monitoring collects logs into an eventhouse you can query.
  Several of these features are in preview.
intake:
  - Who is on call when a pipeline fails or the capacity is throttled?
  - Which jobs and reports are critical enough to alert on?
  - Do you need logs kept for investigation after the fact?
recommendation_note: Alert on job failures and capacity thresholds, and review consumption on a fixed cadence.
adr_context: >-
  Alerts plus a scheduled review were chosen. Job failures and capacity thresholds raise alerts to
  named recipients, and the owner reviews capacity and job health on a fixed cadence. Full log
  collection is left for later.
options:
  - value: reactive
    label: Reactive
    description: Nobody monitors on a schedule. The team looks at the Monitor hub and metrics app after a problem is reported.
    tradeoff: No setup, but failures and throttling are found when users complain.
    pros:
      - No alert rules or monitoring items to maintain
      - Anyone can open the Monitor hub for items they can view
    cons:
      - Failures are found after users notice them
      - Capacity throttling can go unseen until reports slow down
      - Nobody owns a regular look at consumption
    adr_context: >-
      Monitoring is reactive. The team opens the Monitor hub and the Capacity Metrics app when a
      problem is reported, and no alerts or scheduled reviews are configured. The team accepted
      that failures are found after users notice them.
    maturity: ga
    as_of: '2026-10-18'
    sources:
      - url: https://learn.microsoft.com/fabric/admin/monitoring-hub
        title: What is the Monitor hub?
      - url: https://learn.microsoft.com/fabric/enterprise/metrics-app
        title: What is the Microsoft Fabric Capacity Metrics app?
  - value: alerts_review
    label: Alerts and scheduled review
    description: Alert rules cover job failures and capacity thresholds, and an owner reviews consumption on a cadence.
    tradeoff: Problems reach a person quickly, but Activator-based job alerts are in preview and need workspace monitoring.
    pros:
      - Capacity templates alert when a metric crosses a threshold or the capacity changes state
      - A numeric change condition fires once per crossing, not continuously
      - Job alerts can be managed at scale in the Monitor hub
      - Free failure e-mails for scheduled jobs need no Activator or workspace monitoring
    cons:
      - Activator-based job alerts are in preview and need workspace monitoring
      - Capacity operation events are high volume and must be grouped or filtered
      - Recipients and thresholds need an owner and regular upkeep
    adr_context: >-
      Alerts and a scheduled review were chosen. Failed jobs and capacity thresholds alert named
      recipients through Activator rules, and the owner reviews consumption in the Capacity Metrics
      app on the agreed cadence. Thresholds are revisited at each review.
    maturity: preview
    as_of: '2026-10-18'
    value_field_labels:
      review_cadence:
        label: Review cadence
        hint: How often the owner reviews capacity and job health.
    sources:
      - url: https://learn.microsoft.com/fabric/admin/monitoring-hub-alerts
        title: Set up job alerts in the Monitor hub (preview)
      - url: https://learn.microsoft.com/fabric/real-time-hub/tutorial-monitor-capacity-threshold
        title: Monitor Fabric Capacity Health Using Capacity Overview Events
      - url: https://learn.microsoft.com/fabric/real-time-hub/set-custom-alerts-fabric-capacity-overview-events
        title: Create custom alerts on Fabric capacity overview events in Real-Time hub
  - value: full_observability
    label: Full observability
    description: Workspace monitoring collects logs and metrics into an eventhouse for KQL queries, dashboards and alerts.
    tradeoff: Deep history for investigations, but it is in preview, costs extra and does not backfill.
    pros:
      - Logs and metrics from supported items are queryable with KQL
      - Dashboards, Power BI reports and alerts can run on the collected data
      - One monitoring item can collect telemetry from several workspaces
    cons:
      - Workspace monitoring is in preview and not available in every region
      - Collection is off by default and does not backfill earlier activity
      - Collecting and storing the data can add cost
    adr_context: >-
      Full observability was chosen for the production workspaces. Workspace monitoring collects
      logs and metrics into an eventhouse, where the team queries them with KQL and builds alerts
      from the results. Cost and regional availability were reviewed before enabling it.
    maturity: preview
    as_of: '2026-10-18'
    sources:
      - url: https://learn.microsoft.com/fabric/fundamentals/workspace-monitoring-overview
        title: What is workspace monitoring (preview)?
      - url: https://learn.microsoft.com/fabric/admin/monitoring-hub-alerts
        title: Set up job alerts in the Monitor hub (preview)
