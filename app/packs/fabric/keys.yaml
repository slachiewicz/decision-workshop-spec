          - { decision_key: sec.personal_data, not_in: [isolated_minimised], severity: warn, reason_id: pii_without_rules }
      - value: onelake_security
        canvas_effect: { type: lock, scope: storage }
        requires:
          - { decision_key: bi.query_mode, none_of: [direct_lake_sql], severity: warn, reason_id: dl_sql_ignores_onelake }
