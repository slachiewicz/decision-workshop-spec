# Structure layer for the Fabric pack. Driver-owned: content writers read this file and
# never edit it. Ask for a key change in the hand-back instead.
pack: fabric
topics:
  # ---- Part 1. Architecture ----
  - number: 1
    id: medallion_layers
    decision_key: medallion.layers
    cluster: architecture
    status: core
    weight: deep
    mode: decide
    renderer: cards
    decision_type: single
    required: true
    recommendation: [bronze_silver_gold]
    canvas_element: layers
    options:
      - { value: raw_serving, canvas_effect: { type: layer_boxes, layers: [raw, serving] } }
      - { value: bronze_silver_gold, canvas_effect: { type: layer_boxes, layers: [bronze, silver, gold] } }
      - { value: bronze_silver_gold_mart, canvas_effect: { type: layer_boxes, layers: [bronze, silver, gold, mart] } }
    modifiers:
      - { id: landing_zone, decision_key: medallion.landing, on_value: central_landing, off_value: none, canvas_effect: { type: landing_zone, on: true } }

  - number: 2
    id: isolation_strategy
    decision_key: platform.isolation
    cluster: architecture
    status: core
    weight: deep
    mode: decide
    renderer: cards
    decision_type: single
    required: true
    recommendation: [per_layer_per_env]
    canvas_element: containers
    options:
      - { value: per_layer_per_env, canvas_effect: { type: container_grouping, pattern: per_layer } }
      - { value: bronze_silver_shared, canvas_effect: { type: container_grouping, pattern: first_pair_shared } }
      - { value: one_per_env, canvas_effect: { type: container_grouping, pattern: single } }

  - number: 3
    id: platform_centralization
    decision_key: platform.centralization
    cluster: architecture
    status: core
    weight: deep
    mode: decide
    renderer: cards
    decision_type: single
    required: false
    recommendation: [backbone_marts]
    value_fields:
      - { id: platform_owner, type: text, required: false }
    options:
      - { value: backbone_marts }
      - { value: fully_centralized }

  - number: 4
    id: ingestion
    decision_key: integration.mechanisms
    cluster: architecture
    status: core
    weight: deep
    mode: decide
    renderer: source_mapper
    decision_type: multi
    required: true
    recommendation: []
    canvas_element: sources
    options:
      - { value: copy_job }
      - { value: pipelines }
      - { value: mirroring }
      - { value: shortcuts }
      - { value: notebooks }
      - { value: dataflow_gen2 }
      - { value: eventstream }
      - { value: fabric_link }
      - { value: synapse_link }

  - number: 5
    id: storage_engine
    decision_key: storage.engine
    cluster: architecture
    status: core
    weight: deep
    mode: decide
    renderer: cards
    decision_type: single
    required: true
    recommendation: []
    canvas_element: layers
    options:
      - { value: lakehouse_only, canvas_effect: { type: layer_engines, default: lakehouse } }
      - { value: warehouse_only, canvas_effect: { type: layer_engines, default: warehouse } }
      - { value: lakehouse_warehouse, canvas_effect: { type: layer_engines, default: lakehouse, last: warehouse } }

  - number: 6
    id: transform_tool
    decision_key: platform.transform_tool
    cluster: architecture
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: multi
    required: false
    recommendation: []
    options:
      - { value: spark_notebooks }
      - value: tsql_warehouse
        requires:
          - { decision_key: storage.engine, in: [warehouse_only, lakehouse_warehouse], severity: block, reason_id: needs_warehouse }
      - { value: dataflow_gen2 }
      - { value: dbt }

  - number: 7
    id: transform_location
    decision_key: platform.transform_location
    cluster: architecture
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: single
    required: false
    recommendation: []
    canvas_element: containers
    options:
      - { value: colocated, canvas_effect: { type: transform_band, on: false } }
      - { value: separate_engineering, canvas_effect: { type: transform_band, on: true } }

  # ---- Part 2. Platform setup ----
  - number: 8
    id: region
    decision_key: platform.region
    cluster: platform_setup
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: single
    required: true
    recommendation: [primary_region]
    options:
      - value: primary_region
        value_fields:
          - { id: azure_region, type: select, required: true, choices_ref: azure_regions }
      - { value: multi_region }

  - number: 9
    id: compute_strategy
    decision_key: cap.strategy
    cluster: platform_setup
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: single
    required: true
    recommendation: [single_surge]
    options:
      - value: single_surge
        value_fields:
          - { id: starting_sku, type: select, required: false, choices_ref: fabric_skus }
          - { id: surge_level, type: select, required: false, choices_ref: surge_levels }
      - value: split_dev_prod
        requires:
          - { decision_key: ops.environments, in: [dev_prod, dev_test_prod], severity: block, reason_id: needs_two_envs }
      - { value: split_by_bu }
      - { value: split_back_front }

  - number: 10
    id: access_licensing
    decision_key: cap.license
    cluster: platform_setup
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: multi
    required: false
    recommendation: []
    options:
      - value: free_viewers_f64
        requires:
          - { decision_key: cap.strategy, not_in: [split_back_front], severity: warn, reason_id: front_end_sku }
          - { decision_key: cap.strategy, field: starting_sku, in: [F64, F128, F256, F512, F1024, F2048], severity: warn, reason_id: needs_f64 }
      - { value: pro_per_user }
      - { value: ppu }

  - number: 11
    id: environments
    decision_key: ops.environments
    cluster: platform_setup
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: single
    required: true
    recommendation: [dev_test_prod]
    canvas_element: environments
    options:
      - { value: single_env, canvas_effect: { type: env_multiplier, envs: [prod] } }
      - { value: dev_prod, canvas_effect: { type: env_multiplier, envs: [dev, prod] } }
      - { value: dev_test_prod, canvas_effect: { type: env_multiplier, envs: [dev, test, prod] } }

  - number: 12
    id: source_control
    decision_key: ops.git_platform
    cluster: platform_setup
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: single
    required: false
    recommendation: []
    canvas_element: footer
    options:
      - { value: ado, canvas_effect: { type: footer_badge, label_id: git_ado } }
      - { value: github, canvas_effect: { type: footer_badge, label_id: git_github } }
      - { value: none }

  - number: 13
    id: cicd
    decision_key: ops.deployment
    cluster: platform_setup
    status: core
    weight: standard
    mode: decide
    renderer: cards
    decision_type: multi
    required: false
    recommendation: [git_fabric_cicd]
    options:
      - value: git_fabric_cicd
        requires:
          - { decision_key: ops.git_platform, in: [ado, github], severity: block, reason_id: needs_git }
          - { decision_key: ops.environments, not_in: [single_env], severity: warn, reason_id: cicd_single_env }
      - value: deployment_pipelines
        requires:
          - { decision_key: ops.environments, in: [dev_prod, dev_test_prod], severity: block, reason_id: needs_two_stages }
      - { value: manual }

  - number: 14
    id: disaster_recovery
    decision_key: dr.posture
    cluster: platform_setup
    status: core
    weight: deep
    mode: decide
    renderer: cards
    decision_type: single
    required: false
    recommendation: []
    options:
      - { value: builtin_only }
      - value: cross_region_replication
        requires:
          - { decision_key: ops.git_platform, not_in: [none], severity: warn, reason_id: dr_needs_git }
      - value: active_active
        requires:
          - { decision_key: platform.region, in: [multi_region], severity: block, reason_id: needs_multi_region }

